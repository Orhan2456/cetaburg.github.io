<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cetaburg Network</title>
    <!-- Merkeziyetsiz veritabanı (Gun.js) -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body style="max-width: 600px; margin: 0 auto; padding: 10px;"> <!-- Mobil uyum için ufak bir kenar boşluğu eklendi -->
    <!-- Mesajların listeleneceği sade alan -->
    <div id="mesajlar" style="margin-bottom: 20px; height: 350px; overflow-y: auto; font-family: sans-serif; font-size: 14px;"></div>

    <!-- Orijinal tasarımın -->
    <form action="" name="mesajkutusu" method="post" id="mesajFormu">
        <input type="text" name="mesaj" placeholder="Mesaj Yazın...">
        <input type="submit" name="gonder" value="Gönder">
    </form>

    <br>
    <br>
    <!-- Çıkış yapabilmek için basit bir buton -->
    <button id="cikisYap" style="font-size: 12px; cursor: pointer;">Hesaptan Çıkış Yap</button>

    <script>
        // Gun.js ağına bağlan
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const chat = gun.get('cetaburg-network-v4'); // Ağ anahtarı
        
        // Tarayıcı hafızasından kullanıcı bilgilerini çek
        let username = localStorage.getItem('cetaburg_username');
        let profilePic = localStorage.getItem('cetaburg_pic');

        // Eğer kullanıcı adı yoksa (siteye yeni veya gizli sekmeden girdiyse) sor
        if (!username) {
            username = prompt("The Cetaburg Network'e Hoş Geldiniz!\nLütfen bir kullanıcı adı belirleyin:");
            // İptal'e basarsa rastgele isim ver
            if (!username) username = "Misafir_" + Math.floor(Math.random() * 1000);
            
            profilePic = prompt("Profil resminiz için bir URL girin (İstemiyorsanız boş bırakıp Tamam'a basın):");
            if (!profilePic) profilePic = ""; 
            
            // Bilgileri bu tarayıcı/sekme için kaydet
            localStorage.setItem('cetaburg_username', username);
            localStorage.setItem('cetaburg_pic', profilePic);
        }

        const mesajlarAlani = document.getElementById('mesajlar');
        const mesajFormu = document.getElementById('mesajFormu');
        const cikisYapBtn = document.getElementById('cikisYap');
        
        let mesajListesi = [];

        // Ağdaki mesajları dinle ve ekrana yazdır (Herkes anında görür)
        chat.map().once(function(data, id) {
            if (data && data.text) {
                const exists = mesajListesi.find(m => m.id === id);
                if (!exists) {
                    mesajListesi.push({ id, ...data });
                    mesajListesi.sort((a, b) => a.time - b.time); // Zaman sırasına koy
                    ekranaYazdir();
                }
            }
        });

        // Mesajları HTML içine sade bir şekilde yerleştir
        function ekranaYazdir() {
            mesajlarAlani.innerHTML = '';
            mesajListesi.forEach(msg => {
                // Profil resmi varsa soluna ekle
                const imgTag = msg.pic ? `<img src="${msg.pic}" width="25" height="25" style="vertical-align: middle; border-radius: 50%; margin-right: 5px; object-fit: cover;">` : '';
                
                mesajlarAlani.innerHTML += `
                    <div style="margin-bottom: 10px;">
                        ${imgTag}<b>${msg.user}:</b> ${msg.text}
                    </div>
                `;
            });
            // Yeni mesaj gelince en alta kaydır
            mesajlarAlani.scrollTop = mesajlarAlani.scrollHeight;
        }

        // Kendi tasarımın olan Form Gönderildiğinde
        mesajFormu.addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini durdur
            
            const input = document.forms["mesajkutusu"]["mesaj"];
            const metin = input.value.trim();
            
            if (metin !== "") {
                // Mesajı Gun.js (The Cetaburg) ağına gönder
                chat.set({
                    user: username,
                    pic: profilePic,
                    text: metin,
                    time: Date.now()
                });
                input.value = ''; // Kutuyu temizle
            }
        });

        // Çıkış Yap Butonu
        cikisYapBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('cetaburg_username');
            localStorage.removeItem('cetaburg_pic');
            location.reload(); // Bilgileri silip sayfayı yenile (Yeni isim sorması için)
        });
    </script>
</body>
</html>
